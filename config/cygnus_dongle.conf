# The dongle is USB-powered and drives an always-on status display, so it must
# not deep-sleep. This overrides CONFIG_ZMK_SLEEP=y inherited from cygnus.conf.
CONFIG_ZMK_SLEEP=n

# Prospector status-screen layout: Operator (technical, information-dense).
# Default is Classic; this selects the Operator variant of the layout choice.
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
